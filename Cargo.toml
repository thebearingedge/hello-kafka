[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
event = { path = "crates/event" }
util = { path = "crates/util" }

anyhow = "1.0.104"
futures = "0.3.34"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.2", features = ["serde", "v7"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
