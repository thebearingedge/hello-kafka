processes:
  consumer:
    command: cargo run -p consumer
    environment:
      - SSL_CA_LOCATION=${PWD}/infrastructure/openssl/certs/ca.pem
      - SSL_KEY_LOCATION=${PWD}/infrastructure/openssl/certs/client.key
      - SSL_CERT_LOCATION=${PWD}/infrastructure/openssl/certs/client.pem
    availability:
      restart: on_failure
    namespace: example
  producer:
    command: cargo run -p producer
    environment:
      - SSL_CA_LOCATION=${PWD}/infrastructure/openssl/certs/ca.pem
      - SSL_KEY_LOCATION=${PWD}/infrastructure/openssl/certs/client.key
      - SSL_CERT_LOCATION=${PWD}/infrastructure/openssl/certs/client.pem
    availability:
      restart: on_failure
    namespace: example
  simple-consumer:
    command: cargo run -p simple-consumer
    environment:
      - BROKER_ADDRESS=localhost:9091
    availability:
      restart: on_failure
    namespace: simple
  simple-producer:
    command: cargo run -p simple-producer
    environment:
      - BROKER_ADDRESS=localhost:9091
    availability:
      restart: on_failure
    namespace: simple
